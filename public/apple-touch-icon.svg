    /\\/, centred at x=90 (the SVG's half-width).
  -->
  <path fill="#ffffff"
        d="M46 130 V 50 H 70 L 90 100 L 110 50 H 134 V 130 H 116 V 78 L 96 128 H 84 L 64 78 V 130 Z"/>
</svg>
