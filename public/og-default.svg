<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <!--
      Sans-serif stack: librsvg resolves "Arial" ? DejaVu Sans / Helvetica
      reliably across macOS and Linux build agents, where the abstract CSS
      "system-ui" alias is not exposed via Fontconfig.
    -->
    <style>
      .title  { font-family: 'Arial', 'Helvetica', sans-serif; font-weight: 800; }
      .tag    { font-family: 'Arial', 'Helvetica', sans-serif; font-weight: 700; }
      .domain { font-family: 'Arial', 'Helvetica', sans-serif; font-weight: 400; }
    </style>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Brand badge in the top-left, "M" as a vector path to avoid font fallback. -->
  <g transform="translate(80,80)">
    <rect width="120" height="120" rx="24" fill="#1d4ed8"/>
    <path fill="#ffffff"
          transform="translate(60,60) scale(0.45) translate(-90,-90)"
          d="M46 130 V 50 H 70 L 90 100 L 110 50 H 134 V 130 H 116 V 78 L 96 128 H 84 L 64 78 V 130 Z"/>
  </g>

  <text x="80" y="350" class="title" font-size="92" fill="#ffffff">LearnwithManoj</text>
  <text x="80" y="420" class="tag"   font-size="40" fill="#cbd5e1">Never stop Learning.</text>
  <text x="80" y="480" class="domain" font-size="28" fill="#94a3b8">learnwithmanoj.com &#8212; YouTube @LearnwithManoj</text>
</svg>
